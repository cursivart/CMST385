<!-- Mobile navigation trigger & overlay (CSS-only, checkbox hack) -->
<input type="checkbox" id="mobnav-toggle" style="display:none;">
<label class="iconmobile" for="mobnav-toggle" aria-label="Open navigation"></label>
<div class="nav-lightbox-overlay">
  <label for="mobnav-toggle" style="cursor:pointer; color:#fff; font-size:2rem; position:absolute; top:2rem; right:2rem;" aria-label="Close navigation">&times;</label>
  <nav>
    <a class="nav-link navbarbg-1" href="#">about</a>

  </nav>
</div>
	
	<div class="content-container">
			<section class="gallery-grid">
			  <!-- Image 1 -->
			  <input type="checkbox" id="lightbox-1" class="lightbox-toggle" style="display:none;">
			  <div class="grid-box">
				<label for="lightbox-1" class="grid-box-label">
				  <img src="imgs/art1.jpg" alt="Art 1" />
				</label>
				<div class="lightbox-overlay">
				  <label for="lightbox-1" class="lightbox-close">&times;</label>
				  <img src="imgs/art1.jpg" alt="Art 1 Enlarged">
				</div>
			  </div>
			  <!-- Image 2 -->
			  <input type="checkbox" id="lightbox-2" class="lightbox-toggle" style="display:none;">

				  <img src="imgs/art2.jpg" alt="Art 2 Enlarged">

			  </div>

			  <input type="checkbox" id="lightbox-3" class="lightbox-toggle" style="display:none;">
			  <div class="grid-box">
				<label for="lightbox-3" class="grid-box-label">
				  <img src="imgs/art3.jpg" alt="Art 3" />
				</label>
				<div class="lightbox-overlay">
				  <label for="lightbox-3" class="lightbox-close">&times;</label>
				  <img src="imgs/art3.jpg" alt="Art 3 Enlarged">
