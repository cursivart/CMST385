<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>contact</title>
<link href="css/project4-1.css" rel="stylesheet" type="text/css">
</head>

<body>
		<nav class="nav">
  <div class="icon"></div>
  <div class="icon-spacer"></div>
  <a class="nav-link navbarbg-1" href="#">about</a>
  <a class="nav-link navbarbg-2" href="#">portfolio</a>
  <a class="nav-link navbarbg-3" href="#">spotlight</a>
  <a class="nav-link navbarbg-1" href="#">contact</a>
</nav>

<!-- Mobile navigation trigger & overlay (CSS-only, checkbox hack) -->
<input type="checkbox" id="mobnav-toggle" style="display:none;">
<label class="iconmobile" for="mobnav-toggle" aria-label="Open navigation"></label>
<div class="nav-lightbox-overlay">
  <label for="mobnav-toggle" style="cursor:pointer; color:#fff; font-size:2rem; position:absolute; top:2rem; right:2rem;" aria-label="Close navigation">&times;</label>
  <nav>
    <a class="nav-link navbarbg-1" href="#">about</a>
    <a class="nav-link navbarbg-2" href="#">portfolio</a>
    <a class="nav-link navbarbg-3" href="#">spotlight</a>
    <a class="nav-link navbarbg-1" href="#">contact</a>
  </nav>
</div>
	
<div class="content-container">
		<form class="contact-form">
		  <div class="form-columns">
			<div class="form-left">
			  <label for="name">Name:</label><br>
			  <input type="text" id="name" name="name" required><br><br>

			  <label for="email">Email:</label><br>
			  <input type="email" id="email" name="email" required><br>
			</div>
			<div class="form-right">
			  <label for="message">Message:</label><br>
			  <textarea id="message" name="message" rows="6" required></textarea>
			</div>
		  </div>
		  <div class="form-button-row">
			<button type="submit">Send</button>
		  </div>
		</form>
</div>
</body>
</html>
