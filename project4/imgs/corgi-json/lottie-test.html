<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mascot draws a line right-to-left</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; overflow-x: hidden; background: #000022;
      height: 100vh; min-height: 100vh; width: 100vw;
    }
    body {
      min-width: 200px;
    }
    .mascot-bar-wrapper {
      position: fixed;
      top: 2rem;
      left: 0;
      width: 100vw;         
      height: 12rem; /* enough to fit mascot and bar */
      z-index: 10;
      pointer-events: none;
    }
    .magic-bar {
      position: absolute;
      top: 90px;
      right: 0;
      height: 2px;
      background: #4ee0c8;
      border-radius: 1px;
      width: 0;
      min-width: 200px;
      animation: bar-grow-left 2.5s linear forwards;
      z-index: 2;
    }
    @keyframes bar-grow-left {
      0%   { width: 0; }
      8%   { width: 200px; }
      100% { width: 100vw; }
    }
    .mascot-fly {
      position: absolute;
      top: 0;
      right: 0; 
      width: 200px !important;
      height: 100px !important;
      z-index: 3;
      animation: mascot-left 2.5s linear forwards;
      pointer-events: none;
      cursor: default;
      transition: cursor 0.2s;
    }
    .mascot-fly svg {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    @keyframes mascot-left {
      0% { right: 0; }
      100% { right: calc(100vw - 200px); }
    }
    .mascot-landing {
      pointer-events: auto;
      cursor: pointer;
    }
    .lottie-container {
      min-width: 200px;
      width: 200px;
      max-width: 600px;
      margin: 8rem auto 0 auto;
      height: 8rem;
      pointer-events: none;
    }
    @media (max-width: 500px) {
      .mascot-bar-wrapper { height: 12rem; }
      .magic-bar { top: 100px; min-width: 100px; }
      .mascot-fly { width: 100px !important; height: 50px !important; }
    }
  </style>
</head>
<body>
  <div class="mascot-bar-wrapper">
    <div class="magic-bar"></div>
    <div class="mascot-fly" id="lottieMascot"></div>
  </div>
  <div class="lottie-container"></div>
  <script>
    // Lottie mascot
    var mascotContainer = document.getElementById('lottieMascot');
    mascotContainer.style.width = "200px";
    mascotContainer.style.height = "100px";
    var mascotAnim = lottie.loadAnimation({
      container: mascotContainer,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: '/Users/christianstacy/Documents/GitHub/CMST385/project4/imgs/corgi-json/corgi-data.json'
    });
  </script>
</body>
</html>
