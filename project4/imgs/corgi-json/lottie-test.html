<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mascot slides/flips/scales in from left above navbar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    html, body {
      margin: 0; 
      padding: 0;
      overflow-x: hidden;
      height: 100vh;
      min-height: 100vh;
      width: 100vw;
      background: #E1F2A2;
      font-family: 'Segoe UI', 'Arial', sans-serif;
    }
    body {
      min-width: 200px;
      opacity: 0;
      animation: fadein 1s ease-out forwards;
    }
    @keyframes fadein {
      to { opacity: 1; }
    }

    /* ---- BONENAV (LEFT SIDEBAR) ---- */
    .bonenav {
      position: fixed;
      top: 120px; /* move down for mascot */
      left: 0;
      width: 15vw;
      min-width: 125px;
      height: 80vh;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding-top: 5vh;
      background: none;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .bone-link {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1rem;
      color: #0D0D0D;
      background: none;
      text-decoration: none;
      display: flex;
      padding: 1.5rem;
      transition: background 0.15s, color 0.15s, transform 0.15s;
      background-repeat: no-repeat;
      background-position: center left;
      background-size: contain;
    }
    .navbarbg-1 { background-image: url("../Navbone-2@100x.svg"); background-position: center center; background-size: contain; transform: rotate(5deg);}
    .navbarbg-2 { background-image: url("../Navbone-1@100x.svg"); background-position: center; transform: rotate(-5deg);}
    .navbarbg-3 { background-image: url("../Navbone-3@100x.svg"); background-position: center; transform: rotate(5deg);}
    .bone-link:hover, .bone-link:focus {
      color: #FFFFF4;
      transform: scale(1.09);
      outline: none;
      filter: brightness(0.95) drop-shadow(0px 2px 5px #21212133);
    }

    /* ---- Mascot animation slides/flips/scales in from left, above navbar ---- */
    .mascot-anim-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 120px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
    }
    .mascot-walk {
      position: absolute;
      top: 10px;
      left: -120px; /* start hidden to the left */
      width: 100px;
      height: 100px;
      z-index: 101;
      animation: mascot-slide-in 2s ease-out forwards;
      animation-delay: 0.7s;
      pointer-events: none;
      /* --- Flip, scale (change scale as needed) --- */
      transform: scaleX(-1) scale(1.07);
    }
    @keyframes mascot-slide-in {
      from { left: -120px; opacity: 0.2; }
      to   { left: 5vw; opacity: 1; }
    }

    .mascot-static {
      display: none;
      width: 100px;
      height: 100px;
      pointer-events: auto;
      cursor: pointer;
      position: static;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---- Footer ---- */
    .footer-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1vw;
      z-index: 3;
      background-color: #F26052;
      box-sizing: border-box;
      padding-left: 12vw;
      padding-right: 12vw;
      pointer-events: auto;
    }

    /* Content area to right of nav */
    .content-container {
      position: absolute;
      top: 0px;
      right: 0px;
      width: 80vw;
      height: 85vh;
      margin-left: 30vw;
      overflow-y: auto;
      overflow-x: hidden;
      word-break: break-word;
      white-space: normal;
      z-index: 10;
    }

    /* Lightbox overlay */
    .nav-lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(250,251,255,0.93);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 1000;
    }
    .nav-lightbox-overlay.active { display: flex; }
    .nav-lightbox-close {
      position: absolute;
      top: 22px;
      right: 28px;
      font-size: 2rem;
      color: #222;
      cursor: pointer;
      opacity: 0.5;
      font-weight: 900;
      background: none;
      border: none;
    }
    .bonenav-lightbox {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2vh;
    }

    @media (max-width: 700px) {
      .bonenav { display: none !important; }
      .nav-lightbox-overlay { display: none; }
      .nav-lightbox-overlay.active { display: flex; }
      .mascot-anim-container { height: 0 !important; }
      .mascot-walk { display: none !important; }
      .mascot-static {
        display: block !important;
        width: 90px; height: 90px;
        position: static;
        margin: 16px auto 0 auto;
      }
      .footer-bar { height: 15vh; font-size: 1rem; }
      .content-container { width: 100vw; left: 0; }
    }
    @media (max-width: 500px) {
      .content-container { padding-left: 5px; padding-right: 5px; }
      .mascot-static { width: 60px; height: 60px; margin: 10px auto; }
      .footer-bar { height: 15vh;}
    }
  </style>
</head>
<body>
  <!-- Mascot animation slides, flips, and scales in from left, above nav, inside nav container -->
  <div class="mascot-anim-container">
    <div class="mascot-walk" id="lottieMascot"></div>
  </div>

  <nav class="bonenav">
    <a class="bone-link navbarbg-1" href="#">about</a>
    <a class="bone-link navbarbg-2" href="#">portfolio</a>
    <a class="bone-link navbarbg-3" href="#">spotlight</a>
    <a class="bone-link navbarbg-1" href="#">contact</a>
  </nav>

  <!-- Lightbox nav for mobile, hidden by default -->
  <div class="nav-lightbox-overlay" id="nav-overlay">
    <button class="nav-lightbox-close" id="nav-close" aria-label="Close navigation">&times;</button>
    <nav class="bonenav-lightbox">
      <a class="bone-link navbarbg-1" href="#">about</a>
      <a class="bone-link navbarbg-2" href="#">portfolio</a>
      <a class="bone-link navbarbg-3" href="#">spotlight</a>
      <a class="bone-link navbarbg-1" href="#">contact</a>
    </nav>
  </div>
  
  <div class="content-container">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
    <img src="https://www.vice.com/wp-content/uploads/sites/2/2020/07/1595325741061-Untitled-design-5.png?resize=1024,576">
  </div>

  <footer class="footer-bar">
    <!-- Footer links as desired -->
  </footer>
  <script>
    var mascotContainer = document.getElementById('lottieMascot');
    mascotContainer.style.width = "100px";
    mascotContainer.style.height = "100px";
    const REMOTE_JSON = 'https://cmst385-umgc-cstacy3.azurewebsites.net/project4/imgs/corgi-json/corgi-data.json';
    const GITHUB_RAW = 'https://raw.githubusercontent.com/cursivart/CMST385/main/project4/imgs/corgi-json/corgi-data.json';

    function startLottie(path) {
      var mascotAnim = lottie.loadAnimation({
        container: mascotContainer,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: path
      });
    }
    async function tryLoadAnimation() {
      const candidates = ['./corgi-data.json', REMOTE_JSON, GITHUB_RAW];
      for (const url of candidates) {
        try {
          let res;
          try { res = await fetch(url, { method: 'HEAD' }); }
          catch { res = await fetch(url, { method: 'GET' }); }
          if (res && res.ok) { startLottie(url); return; }
        } catch (err) {}
      }
      startLottie('./corgi-data.json');
    }
    tryLoadAnimation();

    document.addEventListener('DOMContentLoaded', function() {
      var overlay = document.getElementById('nav-overlay');
      var closeBtn = document.getElementById('nav-close');
      closeBtn.onclick = function() { overlay.classList.remove('active'); };
      overlay.onclick = function(e) {
        if (e.target === overlay) overlay.classList.remove('active');
      };
      var navLinks = overlay.querySelectorAll('.bone-link');
      navLinks.forEach(function(link) {
        link.onclick = function() { overlay.classList.remove('active'); };
      });
    });
  </script>
</body>
</html>
