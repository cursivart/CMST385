<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mascot draws trailing line (static trail to edge)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; overflow-x: hidden; background: #ffffff;
      height: 100vh; min-height: 100vh; width: 100vw;
    }
    body {
      min-width: 200px;
      opacity: 0;
      animation: fadein 1s ease-out forwards;
    }
    @keyframes fadein { to { opacity: 1; } }
    .mascot-bar-wrapper {
      position: fixed;
      top: 2rem;
      left: 0;
      width: 100vw;
      height: 120px;
      z-index: 10;
      pointer-events: none;
    }
    .permanent-trail {
      position: absolute;
      top: 90px;
      right: 0;
      height: 2px;
      background: #4ee0c8;
      border-radius: 1px;
      width: 0;
      z-index: 2;
      animation: trail-grow 2.5s ease-out forwards;
      animation-delay: 1s;
    }
    @keyframes trail-grow {
      from { width: 0; }
      to   { width: 100vw; }
    }
    .mascot-fly {
      position: absolute;
      top: 0;
      right: -200px;
      width: 200px !important;
      height: 100px !important;
      display: block;
      z-index: 3;
      animation: mascot-left 2.5s ease-out forwards;
      animation-delay: 1s;
      pointer-events: none;
      cursor: default;
    }
    .mascot-fly svg {
      width: 100% !important; height: 100% !important; display: block;
    }
    @keyframes mascot-left {
      from { right: -200px; }
      to   { right: calc(100vw - 200px); }
    }
    .mascot-landing { pointer-events: auto; cursor: pointer; }
    .lottie-container {
      min-width: 200px;
      width: 200px;
      max-width: 600px;
      margin: 8rem auto 0 auto;
      height: 8rem;
      pointer-events: none;
    }
    @media (max-width: 500px) {
      .mascot-bar-wrapper { height: 60px; }
      .permanent-trail { top: 50px; }
      .mascot-fly { width: 100px !important; height: 50px !important; right: -100px; }
      @keyframes mascot-left {
        from { right: -100px; }
        to   { right: calc(100vw - 100px); }
      }
      @keyframes trail-grow {
        from { width: 0; }
        to   { width: 100vw; }
      }
    }
  </style>
</head>
<body>
  <div class="mascot-bar-wrapper">
    <div class="permanent-trail"></div>
    <div class="mascot-fly" id="lottieMascot"></div>
  </div>
  <div class="lottie-container"></div>
  <script>
var mascotContainer = document.getElementById('lottieMascot');
mascotContainer.style.width = "200px";
mascotContainer.style.height = "100px";

// Remote fallback URLs (edit if you have a different remote location)
const REMOTE_JSON = 'https://cmst385-umgc-cstacy3.azurewebsites.net/project4/imgs/corgi-json/corgi-data.json';
const GITHUB_RAW = 'https://raw.githubusercontent.com/cursivart/CMST385/main/project4/imgs/corgi-json/corgi-data.json';

function startLottie(path) {
  console.log('Starting Lottie with', path);
  var mascotAnim = lottie.loadAnimation({
    container: mascotContainer,
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: path
  });

  // Stop animation when mascot reaches docking position
  mascotContainer.addEventListener('animationend', function () {
    try { mascotAnim.stop(); } catch (e) {}
    this.classList.add('mascot-landing'); // Optional, for clickable etc.
  });
}

// Try candidates in order: local relative, your remote, then GitHub raw
async function tryLoadAnimation() {
  const candidates = ['./corgi-data.json', REMOTE_JSON, GITHUB_RAW];
  for (const url of candidates) {
    try {
      console.log('Checking', url);
      // Try a HEAD request first to minimize download; fall back to GET if HEAD not allowed
      let res;
      try {
        res = await fetch(url, { method: 'HEAD' });
      } catch (headErr) {
        // Some servers don't accept HEAD; try GET but don't read body
        res = await fetch(url, { method: 'GET' });
      }
      if (res && res.ok) {
        startLottie(url);
        return;
      }
      console.warn('Unavailable:', url, res && res.status);
    } catch (err) {
      console.warn('Error checking', url, err && err.message);
    }
  }
  // If all candidates failed, still try relative (will show errors in console)
  console.error('All candidates failed; attempting relative fallback');
  startLottie('./corgi-data.json');
}

tryLoadAnimation();
  </script>
</body>
</html>
