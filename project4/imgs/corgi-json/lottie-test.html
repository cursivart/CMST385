<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>title</title>
  <style>
	  @import url('https://fonts.googleapis.com/css2?family=Genos:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
	  
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      background-image: url("../IMG_0306.png");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      font-family: "Genos", sans-serif;
    }

    body {
      min-width: 200px;
      opacity: 0;
      animation: fadein 1s ease-out forwards;
    }
    @keyframes fadein {
      to { opacity: 1; }
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 15vw;
      min-width: 125px;
      height: 100vh;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 5vh;
      box-sizing: border-box;
      background: none;
      pointer-events: auto;
    }

    .nav-link {
      position: relative;
      top: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #0D0D0D;
      background: none;
      text-decoration: none;
      display: flex;
      transition: background 0.15s, color 0.15s, transform 0.15s;
      background-repeat: no-repeat;
      background-position: center left;
      background-size: contain;
      background-color: #9DC6C1;
      line-height: 2rem;
      background-position: center center;
      background-size: contain;
      margin-bottom: 0;
      padding: 0.25rem 1rem 0.25rem 1rem;
    }
    .navbarbg-1 {  transform: rotate(5deg);}
    .navbarbg-2 { transform: rotate(-5deg);}
    .navbarbg-3 { transform: rotate(5deg);}
    .nav-link:hover, .nav-link:focus {
      color: #FFFFF4;
      transform: scale(1.09);
      outline: none;
      filter: brightness(0.95) drop-shadow(0px 2px 5px #21212133);
    }

    .icon-spacer {
      width: 100%;
      height: 100px;
      flex-shrink: 0;
      pointer-events: none;
    }
	  
.icon {
  position: relative;
  top: 12vh;
  height: 150px;
  width: 150px;
  z-index: 101;
  pointer-events: auto; /* <- should be 'auto' if you want hover effect */
  background: url("../3d-cas-logo.svg") center no-repeat;
  background-size: contain;
}

.icon:hover {
  background: url("../3d-cas-logo-neg.svg") center no-repeat;
  background-size: contain;
	cursor: pointer;
	filter: drop-shadow(0 0 1rem #ffffff);
}

    .footer-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 80vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1vw;
      z-index: 1;
      box-sizing: border-box;
      padding-left: 12vw;
      padding-right: 12vw;
      pointer-events: auto;
    }

    .content-container {
      position: relative;
      width: calc(100vw - 15vw);
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      word-break: break-word;
      white-space: normal;
      z-index: 10;
      padding: 3rem;
      margin-left: 15vw;
      box-sizing: border-box;
    }

    .three-col-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      padding: 2rem;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .grid-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 1rem;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Placeholder_view_vector.svg/1362px-Placeholder_view_vector.svg.png?20220519031949');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #e9e9ec;
      box-shadow: 0 2px 10px 0 #0001;
      transition: clip-path 0.35s cubic-bezier(.73,-0.19,.95,.41);
    }
    .grid-box:nth-child(1) { 
      clip-path: polygon(11% 8%, 90% 5%, 100% 26%, 95% 58%, 100% 95%, 79% 100%, 25% 98%, 7% 85%, 0% 42%, 3% 20%);
    }
    .grid-box:nth-child(2) { 
      clip-path: polygon(9% 7%, 96% 3%, 97% 17%, 91% 51%, 100% 83%, 71% 91%, 45% 99%, 10% 81%, 3% 54%, 0% 32%);
    }
    .grid-box:nth-child(3) { 
      clip-path: polygon(18% 2%, 78% 6%, 95% 32%, 80% 60%, 87% 96%, 55% 99%, 22% 91%, 4% 54%, 4% 21%, 15% 13%);
    }
    .grid-box:nth-child(4) { 
      clip-path: polygon(15% 15%, 81% 8%, 95% 28%, 93% 70%, 98% 87%, 83% 98%, 44% 92%, 3% 97%, 0% 64%, 1% 21%);
    }
    .grid-box:nth-child(5) { 
      clip-path: polygon(10% 13%, 79% 2%, 98% 19%, 96% 51%, 99% 88%, 60% 95%, 20% 91%, 9% 68%, 2% 31%, 12% 16%);
    }
    .grid-box:nth-child(6) { 
      clip-path: polygon(13% 7%, 89% 2%, 97% 36%, 91% 65%, 80% 98%, 54% 99%, 23% 94%, 8% 60%, 2% 27%, 14% 15%);
    }
    .nav-lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0D0D0D;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 1000;
    }
    .nav-lightbox-overlay.active { display: flex;}
    .nav-lightbox-close {
      display: none !important;
    }

    /* ----------- MOBILE NAV LOGO BUTTON ----------- */
    .iconmobile {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 5vh; /* Buffer between logo & bottom */
      width: 100px;
      height: 100px;
      transform: translateX(-50%) scale(1);
      z-index: 9999;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 200ms ease-in-out;
      background: url("../CAS White copy.svg") center/contain no-repeat;
    }
    /* Show and size it for mobile/tablet views */
    @media (max-width: 700px) {
      .nav { display: none !important; }
      .icon { display: none !important; }
      .iconmobile {
        display: block;
        width: 15vw;
        min-width: 75px;
        max-width: 140px;
        height: 15vw;
        min-height: 75px;
        max-height: 140px;
        bottom: 5vh;
      }
      .footer-bar { height: 7.5vh; font-size: 1rem;}
      .content-container {
        position: relative;
        width: 100vw;
        margin-left: 0;
        left: 0;
        padding: 1rem;
        height: auto;
      }
      .nav-lightbox-overlay { display: none !important; }
      .nav-lightbox-overlay.active { display: flex !important; }
      .three-col-grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 90vw;
        width: 100vw;
        padding: 1rem;
        gap: 1rem;
      }
    }
    /* Further mobile size tuning */
    @media (max-width: 500px) {
      .content-container {
        padding-left: 5px;
        padding-right: 5px;
        width: 100vw;
        margin-left: 0;
        left: 0;
        padding: 1rem 5px;
        height: auto;
      }
      .footer-bar { height: 10vh;}
      .iconmobile {
        width: 20vw;
        min-width: 60px;
        max-width: 120px;
        height: 20vw;
        min-height: 60px;
        max-height: 120px;
        bottom: 4vh;
      }
      .three-col-grid {
        grid-template-columns: 1fr;
        max-width: 100vw;
        width: 100vw;
        padding-left: 5px; 
        padding-right: 5px;
        gap: 1rem;
      }
    }
    @media (max-width: 250px) {
      .iconmobile { width: 30vw; min-width: 100px;}
    }
  </style>
</head>
<body>
<nav class="nav">
  <div class="icon"></div>
  <div class="icon-spacer"></div>
  <a class="nav-link navbarbg-1" href="#">about</a>
  <a class="nav-link navbarbg-2" href="#">portfolio</a>
  <a class="nav-link navbarbg-3" href="#">spotlight</a>
  <a class="nav-link navbarbg-1" href="#">contact</a>
</nav>

<!-- Navigation lightbox overlay for mobile -->
<div class="nav-lightbox-overlay" id="nav-overlay">
  <nav class="nav-lightbox">
    <a class="nav-link navbarbg-1" href="#">about</a>
    <a class="nav-link navbarbg-2" href="#">portfolio</a>
    <a class="nav-link navbarbg-3" href="#">spotlight</a>
    <a class="nav-link navbarbg-1" href="#">contact</a>
  </nav>
</div>
  
<div class="content-container">
			<blockquote style="color: #FFFFFF; font-stretch: 200%;">
			<h1>
			"You're only given a little spark of madness. You mustn't lose it."
		</h1>
		    &mdash; Robin Williams 
	</blockquote>
  <section class="three-col-grid">
    <div class="grid-box"></div>
    <div class="grid-box"></div>
    <div class="grid-box"></div>
    <div class="grid-box"></div>
    <div class="grid-box"></div>
    <div class="grid-box"></div>
  </section>
</div>

<footer class="footer-bar"></footer>
<!-- Mobile nav logo trigger - bottom center -->
<div class="iconmobile" id="iconMobile"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var overlay = document.getElementById('nav-overlay');
  var iconMobile = document.getElementById('iconMobile');
  var navLinks = overlay.querySelectorAll('.nav-link');
  
  // Automatically show overlay if in mobile view (optional: you may want to ONLY show on icon click)
  function showOverlayIfMobile() {
    if (window.innerWidth <= 700) {
      overlay.classList.remove('active'); // Only show when icon is clicked
    } else {
      overlay.classList.remove('active');
      if (iconMobile) iconMobile.classList.remove('scaled');
    }
  }
  showOverlayIfMobile();
  window.addEventListener('resize', showOverlayIfMobile);

  navLinks.forEach(function(link) {
    link.onclick = function() {
      overlay.classList.remove('active');
      if (iconMobile) iconMobile.classList.remove('scaled');
    };
  });
  if (iconMobile) {
    iconMobile.addEventListener('click', function() {
      var active = overlay.classList.toggle('active');
      if (active) {
        iconMobile.classList.add('scaled');
      } else {
        iconMobile.classList.remove('scaled');
      }
    });
  }
  overlay.onclick = function(e) {
    if (e.target === overlay) {
      overlay.classList.remove('active');
      if (iconMobile) iconMobile.classList.remove('scaled');
    }
  };
});
</script>
</body>
</html>
