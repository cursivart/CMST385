<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
	<script>
	document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.album').forEach(album => {
    album.addEventListener('click', function() {
      // Remove 'active' from all albums
      document.querySelectorAll('.album').forEach(a => a.classList.remove('active'));

      // Set this album as active (enlarge and show info)
      this.classList.add('active');

      // Insert album details
      const infoDiv = this.querySelector('.album-info');
      infoDiv.innerHTML = `
        <strong>${this.dataset.title}</strong> (${this.dataset.year})<br>
        <em>by ${this.dataset.artist}</em><br>
        ${this.dataset.info}
      `;
    });
  });
});
	</script>
	<style>
		
		html, body {
			height: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
		}

		body {
			background-image: linear-gradient(to bottom, #E2F4F8,#CECECE);
			background-repeat: no-repeat;
			background-attachment: fixed;
		}
		
		.dmb-logo {
			background-image: url('imgs/Dave-Matthew-Band_Logo-w-circle2.svg');
			filter: drop-shadow(0rem 0rem 3rem #9AACC6);
			position: fixed;
			top: 50%;
			left: 50%;
			width: 400px;
			height: 400px;
			z-index: 2;
			opacity: 0;
			transform: translate(-50%, -50%);
			animation: logo-fadein 1.5s cubic-bezier(0.4,0,0.2,1) forwards;
			transition: filter .5s ease-in-out;
		}
		
		.dmb-logo:hover {
			filter:
				drop-shadow(0 0 3rem #FFBC0A)
				sepia(1)
				hue-rotate(15deg)
				saturate(5)
				brightness(1.2);
		}

		@keyframes logo-fadein {
			to {
				opacity: 1;
		  }
		}

		.bodywrapper {
			display: grid;
			grid-auto-columns: 1fr 2fr;
			gap: 1rem;
			grid-column-areas:
				"discography biography";
			position: absolute;
			top: 1000px;
			left: 0px;
			background-image: url("imgs/Blue-ridge-mountains_transparent-bg.png");
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
			width: 100vw;
			min-height: 100vh;
			z-index: 5;
		}
		
		.timeline {
			position: relative;
  			display: flex;
			flex-direction: column;
			align-items: flex-start;
			margin: 3rem 0 0 2rem;
			height: auto;
			border-left: 2px solid #FFBC0A; /* vertical timeline line */
			border-bottom: none;
			padding-left: 5rem;
		}
		
.discography {
  grid-column: 1;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  height: 100%;
  background: rgba(255,255,255,0.03); /* optional */
  min-width: 0;
}

.vertical-label {
	writing-mode: vertical-lr;
	text-orientation: mixed;
	font-size: 1.4rem;
	letter-spacing: 0.1em;
	color: #FFBC0A;
	font-weight: bold;
	margin-right: 0.8rem;
	margin-left: 3rem;
	margin-top: 50vh;
	align-self: flex-start;
}

.timeline {
  border-left: 2px solid #FFBC0A;
  padding-left: 2rem;
  min-height: 90vh;
}
		
		.biography {
			grid-column: 2;
			min-width: 0;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			padding: 3rem;
			margin-top: 5rem;
		}
		
		.year-label {
			left: -2.5rem;
			bottom: 0;
			font-size: 1rem;
			width: 4rem;
			text-align: right;
			position: static;      /* not absolute if vertical */
			margin-bottom: -1.3rem;
			margin-left: -5.5rem;  /* adjust for timeline line */
			color: #FFBC0A;
			font-size: 1rem;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s;
			width: 6rem;
			text-align: right;
		}
		
		.album:hover .year-label {
			opacity: 1;
			pointer-events: auto;
		}
		
    .album {
		cursor: pointer;
		transition: transform 0.25s cubic-bezier(.65,0,.35,1);
		z-index: 1;
		display: flex;
		align-items: center;
		margin: 1.5rem 0;
		position: relative;
    }
		
    .album img {
		width: 100px;
		border-radius: 10px;
		box-shadow: 0 2px 10px #1118;
		transition: box-shadow 0.4s, transform 0.4s;
		border: 3px solid #222;
		margin-left: 1.2rem;
    }
		
    .album.active img {
		transform: scale(1.22);
		box-shadow: 0 8px 30px #FFBC0A99, 0 2px 10px #111a;
		border-color: #FFBC0A;
		z-index: 2;
    }
		
    .album-info {
		display: none;
		position: absolute;
		top: -140px;
		left: 50%;
		transform: translateX(-50%);
		min-width: 220px;
		background: #FFFCE4;
		color: #222;
		border-radius: 10px;
		box-shadow: 0 8px 24px #1115;
		padding: 1rem 1.1rem;
		font-size: 1.08em;
		z-index: 5;
		border: 2px solid #FFBC0A;
		pointer-events: none;
    }
		
    .album.active .album-info {
		display: block;
		animation: fadein 0.6s;
    }
		
    @keyframes fadein {
		from { opacity: 0; transform: translateX(-50%) translateY(25px);}
		to { opacity: 1; transform: translateX(-50%) translateY(0);}
    }
		
    @media (max-width: 600px) {
		.timeline { flex-direction: column; height: auto; border-bottom: none; }
		.album { margin: 2rem 0; }
		.year-label { left: -3.5rem; top: 45px; bottom: auto;}
    }
		
	</style>
<title>Dave Matthews Band</title>
</head>
